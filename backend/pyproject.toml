[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Put the backend root on sys.path so `import app` works under the bare `pytest`
# console script in CI (not just `python -m pytest`, which adds the CWD itself).
pythonpath = ["."]
