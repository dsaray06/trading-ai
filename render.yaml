# Render Blueprint — deploys the whole app: managed Postgres + FastAPI backend
# (Docker) + static React frontend. Connect this repo as a Blueprint in Render.
# See DEPLOY.md for the step-by-step.
#
# Assumes the GitHub repo root is this `trading-ai/` directory.

databases:
  - name: trading-ai-db
    plan: free
    databaseName: tradingai
    user: tradingai

services:
  # ---- Backend (FastAPI, Docker) ----
  - type: web
    name: trading-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # The image CMD (backend/start.sh) runs migrations then serves on $PORT.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-ai-db
          property: connectionString
      - key: SECRET_KEY        # encrypts users' Alpaca secrets — generated once, do not rotate
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY # set this in the dashboard (secret)
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALPACA_BASE_URL   # paper host only — never live
        value: https://paper-api.alpaca.markets
      # Server-wide Alpaca key for MARKET DATA (prices + option chains). Alpaca's
      # IEX/indicative feeds work with any single account's keys (like Finnhub) and
      # work from cloud IPs where yfinance is blocked — so this one key powers the
      # Research/Options tabs for everyone. Users still connect their OWN keys for
      # the Portfolio tab (paper trading). Set both in the dashboard (secret).
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      # Set to the frontend's PUBLIC url after first deploy, e.g.
      # https://trading-ai-frontend-xxxx.onrender.com (fromService host gives the
      # internal hostname, which a browser can't use).
      - key: CORS_ORIGINS
        sync: false

  # ---- Frontend (Vite build -> static site) ----
  - type: web
    name: trading-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set to the backend's PUBLIC url after first deploy, e.g.
      # https://trading-ai-backend-xxxx.onrender.com (fromService host gives the
      # internal hostname, which a browser can't use). Rebuild after changing.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
